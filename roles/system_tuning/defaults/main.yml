---
# Core dump storage limits.
#
# systemd's defaults are proportional to disk size, which is the wrong shape
# for a 912 GB volume: MaxUse defaults to 10% of the filesystem (~91 GB) and
# KeepFree to 15% free (~137 GB). Nothing prunes until those are reached.
#
# That matters because Black Mesa segfaults during shutdown on every single
# exit — a known Source-engine-on-Linux bug, harmless in itself, but each one
# writes a 300-500 MB core. Seven of them had reached 2.8 GB with no ceiling
# in sight. A tmpfiles rule ages the directory at two weeks, far too slow to
# help.
system_tuning_manage_coredump_limits: true
system_tuning_coredump_max_use: 1G
system_tuning_coredump_keep_free: 20G

# Skip storing dumps larger than this entirely.
#
# Set to 100M on 2026-08-24. Black Mesa's exit crash writes 300-500 MB and is a
# known, unfixable shutdown bug — there is nothing to learn from keeping it, and
# even under the MaxUse cap it would evict anything smaller and more useful.
# 100M still captures the crashes worth looking at: the two findmnt segfaults on
# 2026-08-15 were 56 KB each.
#
# The trade-off is real. A large core from something you DO want to debug will
# now be skipped rather than truncated, and the journal records the crash
# either way — but the memory image is gone. Raise or clear this if that
# matters more than the disk.
system_tuning_coredump_process_size_max: "100M"

# A drop-in rather than editing /etc/systemd/coredump.conf directly, so a
# systemd package update doesn't conflict with our changes.
system_tuning_coredump_dropin: /etc/systemd/coredump.conf.d/50-cap-storage.conf
