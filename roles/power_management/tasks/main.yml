---
# ---------------------------------------------------------------------------
# USB wake sources
#
# The wake signal crosses five levels and every one must be armed. Arming the
# input device and its hub is NOT enough — both report "enabled" and the
# machine still will not wake, because the signal dies at the root hub above
# them. That cost an afternoon on 2026-08-20.
#
# This role can arm all of it. It CANNOT set the firmware option the whole
# thing depends on: MSI BIOS -> Wake Up Event Setup -> Resume By USB Device.
# With that disabled the rule is present, correct and completely inert, so the
# verification below reports the chain rather than assuming success.
# ---------------------------------------------------------------------------
- name: Install the USB wake udev rule
  ansible.builtin.copy:
    src: 90-usb-input-wakeup.rules
    dest: /etc/udev/rules.d/90-usb-input-wakeup.rules
    owner: root
    group: root
    mode: "0644"
  when: power_manage_usb_wake | bool
  notify:
    - Reload udev rules
    - Re-trigger USB devices

- name: Apply udev changes now
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------------------
# Plasma settings
#
# kwriteconfig6, never file copying. Plasma rewrites these files while it runs,
# so copying whole files fights it for ownership and clobbers every setting not
# declared here. Same reasoning as the KDE notes in CLAUDE.md.
#
# become: false throughout — these are per-user config files. Under sudo they
# would be written into root's home, where the desktop session never reads
# them, and the run would report success.
# ---------------------------------------------------------------------------
- name: Determine the user Plasma settings will be written for
  ansible.builtin.command: id -un
  become: false
  changed_when: false
  check_mode: false
  register: power_desktop_user

- name: Fail if Plasma settings would be written for root
  ansible.builtin.fail:
    msg: >-
      These are per-user Plasma settings and would be written into root's home,
      where your desktop will never read them. Run the playbook as your desktop
      user with --ask-become-pass rather than under sudo.
  when: power_desktop_user.stdout == 'root'

# Read before writing so the role is honestly idempotent. kwriteconfig6 has no
# "only if different" mode and always exits 0, so running it unconditionally
# would report changed on every single run.
- name: Read the current value of each Plasma setting
  ansible.builtin.command:
    argv: "{{ ['kreadconfig6', '--file', item.file] + item.group_args + ['--key', item.key] }}"
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  register: power_current
  loop: "{{ power_plasma_settings }}"
  loop_control:
    label: "{{ item.file }}:{{ item.key }}"

- name: Apply Plasma power and lock settings
  ansible.builtin.command:
    argv: "{{ ['kwriteconfig6', '--file', item.item.file] + item.item.group_args + ['--key', item.item.key, item.item.value | string] }}"
  become: false
  when: item.stdout | default('') | trim != item.item.value | string
  loop: "{{ power_current.results }}"
  loop_control:
    label: "{{ item.item.file }}:{{ item.item.key }}"

# ---------------------------------------------------------------------------
# Verification
# ---------------------------------------------------------------------------
- name: Check the USB wake chain from the input device upward
  ansible.builtin.shell:
    cmd: |
      dev=$(grep -oE 'idVendor}=="[0-9a-f]{4}"' /etc/udev/rules.d/90-usb-input-wakeup.rules | head -1)
      for d in /sys/bus/usb/devices/*/; do
        [ "$(cat "$d/idVendor" 2>/dev/null)" = "1bcf" ] || continue
        p=$(readlink -f "$d")
        while [ -n "$p" ] && [ "$p" != /sys/devices ]; do
          if [ -e "$p/power/wakeup" ]; then
            printf '%s=%s\n' "$(basename "$p")" "$(cat "$p/power/wakeup")"
          fi
          p=$(dirname "$p")
        done
        break
      done
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  register: power_wake_chain
  when: power_manage_usb_wake | bool

- name: Report the USB wake chain
  ansible.builtin.debug:
    msg: >-
      USB wake chain: {{ power_wake_chain.stdout_lines | default([]) | join(', ') }}.
      {% if 'disabled' in (power_wake_chain.stdout | default('')) %}
      At least one level is DISABLED, so the machine will not wake on keypress.
      If the rule is installed and levels are still disabled, the block is
      firmware: MSI BIOS -> Wake Up Event Setup -> Resume By USB Device must be
      Enabled. This role cannot set that.
      {% else %}All levels armed.{% endif %}
  when:
    - power_manage_usb_wake | bool
    - power_wake_chain.stdout | default('') | length > 0

- name: Report the sleep configuration
  ansible.builtin.debug:
    msg: >-
      Screens dim at {{ power_display_dim_sec }}s, blank and lock at
      {{ power_display_off_sec }}s, suspend after {{ power_suspend_idle_sec }}s.
      Plasma may need a session restart to pick up changed values.

# ---------------------------------------------------------------------------
# Auto-login
#
# Closes the one gap this role otherwise cannot reach: the greeter runs as its
# own user with no power management, so time spent at the login screen is time
# the machine stays fully awake. See defaults/main.yml for the security
# tradeoff this represents.
# ---------------------------------------------------------------------------
- name: Resolve the desktop user for auto-login
  ansible.builtin.command: id -un
  become: false
  changed_when: false
  check_mode: false
  register: power_login_user
  when: power_autologin | bool

# Same trap as the per-user settings above: run under sudo and this resolves to
# root. Auto-logging in as root is not a mistake to make silently.
- name: Fail if auto-login would be configured for root
  ansible.builtin.fail:
    msg: >-
      Auto-login resolved to root. Run the playbook as your desktop user with
      --ask-become-pass, not under sudo.
  when:
    - power_autologin | bool
    - power_login_user.stdout == 'root'

- name: Check the configured session actually exists
  ansible.builtin.stat:
    path: "/usr/share/wayland-sessions/{{ power_autologin_session }}.desktop"
  register: power_session_file
  when: power_autologin | bool

# Naming a session that does not exist produces a machine that boots into a
# login loop. Refuse rather than write a file that breaks the next boot.
- name: Fail if the configured session does not exist
  ansible.builtin.fail:
    msg: >-
      power_autologin_session is "{{ power_autologin_session }}" but
      /usr/share/wayland-sessions/{{ power_autologin_session }}.desktop does
      not exist. Auto-login would fail at the next boot.
  when:
    - power_autologin | bool
    - not power_session_file.stat.exists

- name: Ensure the plasmalogin drop-in directory exists
  ansible.builtin.file:
    path: "{{ power_autologin_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: power_autologin | bool

- name: Configure auto-login so the greeter is never left sitting awake
  ansible.builtin.copy:
    dest: "{{ power_autologin_dropin }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by roles/power_management.
      #
      # The plasmalogin greeter runs as its own user with no power management
      # at all, so a machine left at the login screen never dims, blanks or
      # suspends. Logging straight in hands the session to PowerDevil, which
      # applies the idle timings this role sets.
      [Autologin]
      User={{ power_login_user.stdout }}
      Session={{ power_autologin_session }}
  when: power_autologin | bool

- name: Remove the auto-login drop-in when disabled
  ansible.builtin.file:
    path: "{{ power_autologin_dropin }}"
    state: absent
  when: not (power_autologin | bool)

# ---------------------------------------------------------------------------
# The Saturday maintenance window
#
# Two problems, one window. The machine is asleep when the Saturday timers
# elapse, and waking it does not keep it awake — see defaults/main.yml for the
# evidence behind both.
#
# This is a SYSTEM timer deliberately. WakeSystem=true needs CAP_WAKE_ALARM to
# arm the RTC, which a --user timer does not have; ha-backup.timer reports
# WakeSystem=no for exactly that reason and cannot be moved to the system
# manager, because it authenticates to Home Assistant with the desktop user's
# SSH key and root's is not authorised there.
# ---------------------------------------------------------------------------
- name: Install the maintenance window service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/maintenance-window.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by roles/power_management.
      #
      # Holds a logind sleep inhibitor for the length of the Saturday
      # maintenance window, so the machine cannot suspend out from under the
      # update, the Home Assistant backup or the weekly report.
      #
      # --what=sleep only. Deliberately NOT sleep:idle — inhibiting idle would
      # also stop the screen locking, and the lock is the security boundary.
      # The screen still dims, blanks and locks normally inside the window.
      [Unit]
      Description=Hold off sleep for the Saturday maintenance window
      Documentation=file://{{ playbook_dir }}/roles/power_management/README.md

      [Service]
      Type=simple
      ExecStart=/usr/bin/systemd-inhibit --what=sleep --who=maintenance-window --why="Saturday maintenance window" --mode=block /usr/bin/sleep {{ power_maintenance_window_sec }}
      # An inhibitor that hangs must not hold sleep off forever. Comfortably
      # longer than the window itself, short enough to self-clear the same day.
      RuntimeMaxSec={{ power_maintenance_window_sec | int + 600 }}
  when: power_maintenance_window | bool
  register: power_window_service

- name: Install the maintenance window timer unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/maintenance-window.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by roles/power_management.
      #
      # WakeSystem=true arms an RTC alarm so the machine resumes from suspend
      # to run this. It fires ahead of the update so everything downstream
      # runs on schedule rather than as a Persistent catch-up.
      #
      # Persistent=false, unlike the timers it protects. If this window is
      # missed entirely there is no point running a two-hour inhibitor at some
      # unrelated hour — and the update and backup each carry their own
      # Persistent=true, so a genuinely missed Saturday still catches up.
      [Unit]
      Description=Wake for the Saturday maintenance window

      [Timer]
      OnCalendar={{ power_maintenance_window_start }}
      WakeSystem=true
      Persistent=false

      [Install]
      WantedBy=timers.target
  when: power_maintenance_window | bool
  register: power_window_timer

- name: Reload systemd after maintenance window unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - power_maintenance_window | bool
    - power_window_service.changed or power_window_timer.changed

- name: Enable and start the maintenance window timer
  ansible.builtin.systemd_service:
    name: maintenance-window.timer
    enabled: true
    state: started
  when: power_maintenance_window | bool

# RTC wake is a claim until the hardware honours it. This machine has form:
# the USB wake chain read `enabled` at all five levels and was completely
# inert until a BIOS option was changed. Report what the kernel exposes and
# say plainly that it is not proof.
- name: Check whether the RTC exposes a wake alarm
  ansible.builtin.stat:
    path: /sys/class/rtc/rtc0/wakealarm
  register: power_rtc_wakealarm
  when: power_maintenance_window | bool

- name: Read the armed RTC alarm
  ansible.builtin.command: cat /sys/class/rtc/rtc0/wakealarm
  register: power_rtc_alarm_value
  changed_when: false
  failed_when: false
  when:
    - power_maintenance_window | bool
    - power_rtc_wakealarm.stat.exists | default(false)

- name: Report the maintenance window
  ansible.builtin.debug:
    msg:
      - "window:  {{ power_maintenance_window_start }}"
      - "holds sleep off for: {{ (power_maintenance_window_sec | int) // 60 }} min"
      - "RTC wakealarm: {{ 'present' if power_rtc_wakealarm.stat.exists else 'MISSING - RTC wake cannot work' }}"
      - "alarm armed: {{ power_rtc_alarm_value.stdout | default('') | trim | default('no', true) }}"
      - "Presence is not proof. Verify with a real suspend - see the README."
  when: power_maintenance_window | bool

- name: Remove the maintenance window units when disabled
  ansible.builtin.file:
    path: "/etc/systemd/system/maintenance-window.{{ item }}"
    state: absent
  loop:
    - timer
    - service
  when: not (power_maintenance_window | bool)
