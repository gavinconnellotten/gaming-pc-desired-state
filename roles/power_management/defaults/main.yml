---
# Idle behaviour, in four deliberately separated stages:
#
#   10 min  dim      — screen still on, just darker. A warning, costs nothing.
#   20 min  blank    — display output stops. NOT a lock; moving the mouse
#                      brings it straight back with no password.
#   30 min  lock     — the password prompt. Ten minutes after the screen went
#                      dark, so a short absence costs nothing.
#   60 min  suspend  — see the SuspendAndShutdown section.
#
# Revised twice on 2026-08-21. Originally dim 9 / blank+lock 10, which locked
# the session several times a day. Then briefly blank+lock together at 20.
# Now decoupled: blanking saves the power, locking is the security boundary,
# and there is no reason they have to happen at the same moment.
power_display_dim_sec: 600
power_display_off_sec: 1200
power_display_off_when_locked_sec: 120

# kscreenlocker counts in MINUTES, unlike everything else here. Deliberately
# LATER than power_display_off_sec — the screen is already dark by then, so
# this is purely about when a password becomes required.
power_lock_timeout_min: 30
power_lock_on_resume: true

# PowerDevil action enum. 1 = Sleep, 8 = Shut down — VERIFIED on this machine
# by setting each in System Settings and reading back what was written, not
# inferred. Worth keeping that provenance: the numbering is not documented
# anywhere obvious, and guessing wrong here means a machine that shuts down
# after an hour of idle instead of sleeping.
power_suspend_action: 1
power_suspend_idle_sec: 3600
power_button_action: 1

# Whether to manage USB wake sources. See the README for the firmware setting
# this depends on and cannot supply.
power_manage_usb_wake: true

# The Saturday maintenance window.
#
# Three things are scheduled on a Saturday morning — the system update, the
# Home Assistant backup, and the weekly report. All three were being missed,
# for two separate reasons:
#
#   1. The machine is asleep at the scheduled time, so nothing fires until
#      somebody wakes it. On 2026-09-12 the update timer triggered at
#      08:28:13, the same SECOND the machine resumed from S3 — its 08:00
#      window had passed while it slept and Persistent=true caught it up.
#
#   2. Waking it is not enough. With nobody at the keyboard there is no
#      input, so PowerDevil's idle countdown runs from the moment of wake and
#      suspends the machine again an hour later — before the 09:30 backup.
#      The backup succeeded on 2026-09-12 only because the owner happened to
#      be sitting at the machine.
#
# So the window does two things: an RTC alarm wakes the machine, and a logind
# inhibitor holds sleep off until the last scheduled event has run.
#
# WakeSystem=true only wakes from SUSPEND, never from a powered-off machine.
# That suits this one — it sleeps rather than shutting down; the current boot
# has been up since 2026-09-11 and simply slept overnight. If it is ever
# genuinely switched off, the RTC alarm cannot help and the Persistent=true on
# each timer remains the fallback.
power_maintenance_window: true
power_maintenance_window_start: "Sat *-*-* 08:10:00"

# 08:10 + 2h20m = 10:30, which clears the report. Sleep is held off for this
# long; the screen still dims, blanks and LOCKS on the normal timings, because
# the inhibitor asks for `sleep` only and not `idle`. Locking is the security
# boundary and there is no reason to give it up to keep the machine awake.
power_maintenance_window_sec: 8400

# Every Plasma setting this role owns, declared explicitly. group_args is
# spelled out rather than generated, because kwriteconfig6 takes a repeated
# --group flag and building that from a list is the kind of cleverness that
# makes a config role hard to read.
power_plasma_settings:
  - file: powerdevilrc
    group_args: ['--group', 'AC', '--group', 'Display']
    key: DimDisplayIdleTimeoutSec
    value: "{{ power_display_dim_sec }}"
  - file: powerdevilrc
    group_args: ['--group', 'AC', '--group', 'Display']
    key: TurnOffDisplayIdleTimeoutSec
    value: "{{ power_display_off_sec }}"
  - file: powerdevilrc
    group_args: ['--group', 'AC', '--group', 'Display']
    key: TurnOffDisplayIdleTimeoutWhenLockedSec
    value: "{{ power_display_off_when_locked_sec }}"
  - file: powerdevilrc
    group_args: ['--group', 'AC', '--group', 'SuspendAndShutdown']
    key: AutoSuspendAction
    value: "{{ power_suspend_action }}"
  - file: powerdevilrc
    group_args: ['--group', 'AC', '--group', 'SuspendAndShutdown']
    key: AutoSuspendIdleTimeoutSec
    value: "{{ power_suspend_idle_sec }}"
  - file: powerdevilrc
    group_args: ['--group', 'AC', '--group', 'SuspendAndShutdown']
    key: PowerButtonAction
    value: "{{ power_button_action }}"
  - file: kscreenlockerrc
    group_args: ['--group', 'Daemon']
    key: Autolock
    value: "true"
  - file: kscreenlockerrc
    group_args: ['--group', 'Daemon']
    key: Timeout
    value: "{{ power_lock_timeout_min }}"
  - file: kscreenlockerrc
    group_args: ['--group', 'Daemon']
    key: LockOnResume
    value: "{{ power_lock_on_resume | lower }}"

# Auto-login.
#
# The login screen runs as a SEPARATE user (the plasmalogin greeter) with no
# PowerDevil at all — verified 2026-09-02 by finding zero PowerDevil journal
# entries across a 49-minute greeter session. A machine left sitting at that
# screen never dims, never blanks and never suspends; it stays fully awake
# indefinitely. None of the timings above apply to it, and they cannot be made
# to: the greeter is a different user and never reads this user's config.
#
# Logging straight through to the desktop hands the machine to PowerDevil at
# boot, which is the only practical way to close that gap.
#
# Accepted tradeoff, agreed with the owner 2026-09-02: no password at power-on.
# The lock screen still applies after power_lock_timeout_min of idle and on
# resume from suspend, so the machine is still protected once it has been left.
power_autologin: true
power_autologin_session: plasma

# A drop-in, not an edit to /etc/plasmalogin.conf — that file is owned by the
# plasma-login-manager package and would be replaced on update.
power_autologin_dropin: /etc/plasmalogin.conf.d/10-autologin.conf
