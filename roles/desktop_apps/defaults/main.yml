---
# Applications installed by hand after the Nobara install. Same principle as
# roles/gaming: manage the delta, leave the distribution's own packages alone.

# RPMs. qbittorrent comes from the nobara repo; proton-vpn-gtk-app from terra,
# which Nobara enables by default.
#
# ProtonVPN is deliberately the RPM rather than the Flathub build. A VPN client
# needs to talk to NetworkManager and manage routes and DNS for the whole
# system; the flatpak is sandboxed and makes that harder for no benefit. See
# the README.
desktop_apps_dnf:
  - qbittorrent
  - proton-vpn-gtk-app
  - librewolf

# Flatpaks, installed at USER scope to match the two already on this machine
# (Flatseal and Bazaar). Mixing user and system scope makes "why do I have two
# copies of this" conversations later.
desktop_apps_flatpak_remote: flathub
desktop_apps_flatpaks:
  - id: me.proton.Mail
    name: Proton Mail

# Proton Drive has no Linux desktop client. rclone speaks its protocol and is
# the usual workaround, but it is a command-line sync tool rather than a
# drop-in replacement, so it is off unless asked for. See the README.
desktop_apps_install_rclone: false

# ---------------------------------------------------------------------------
# Browsers
# ---------------------------------------------------------------------------

# LibreWolf ships from its own repo, and NOTHING on this machine owns
# /etc/yum.repos.d/librewolf.repo — it was added by hand on 2026-08-09. A
# rebuild would therefore have no repo to install from, and the default-browser
# step below would point at a desktop file that doesn't exist. Hence the repo
# is declared here rather than assumed.
desktop_apps_manage_librewolf_repo: true
desktop_apps_librewolf_repo_file: /etc/yum.repos.d/librewolf.repo

# Packages to remove. EMPTY, and deliberately so — the task below is skipped
# while this list is empty.
#
# This used to contain brave-browser. That was abandoned on 2026-09-12 after it
# failed on every run. The decision is recorded rather than the attempt deleted,
# because the reasoning is the useful part:
#
#   - Brave shipped with the Nobara image — dnf transaction 1 lists
#     brave-browser-0:1.89.143-1.x86_64 — so removing it was always a departure
#     from "manage the delta, not the distribution".
#   - It never worked. dnf history shows brave-browser being UPGRADED
#     (transactions 28 and 35, now at 1.95.101) and never once removed. The
#     playbook errored on this step every run.
#   - It is NOT dnf-protected, so that was not the blocker. What is true:
#     nobara-browser-policy requires brave-browser, and Nobara's own updater
#     treats the image package set as something to maintain. Fighting that is
#     exactly what this repo says not to do.
#
# So Brave stays installed and unmanaged, which makes the default-browser
# setting below load-bearing rather than cosmetic: Brave being present is why
# Proton Mail's links went somewhere unwanted in the first place.
#
# If Brave ever genuinely needs to go, do it by hand and read the real error:
#   sudo dnf remove brave-browser nobara-browser-policy
desktop_apps_remove: []

# Default browser, applied with xdg-settings after the packages are in place —
# setting a default for a desktop file that doesn't exist yet silently does
# nothing. Empty string disables the behaviour.
desktop_apps_default_browser: librewolf.desktop

# ---------------------------------------------------------------------------
# qBittorrent: don't let the machine sleep mid-transfer
#
# roles/power_management suspends this machine after an hour idle, and a
# torrent transferring is not "idle" in any sense the owner cares about.
# qBittorrent has this built in (verified in the 5.2.3 binary: the settings
# checkPreventFromSuspendWhenDownloading / ...WhenSeeding, and an InhibitorDBus
# class), so it registers a D-Bus inhibition — the same mechanism games use and
# the one PowerDevil actually honours. No wrapper or watcher needed.
#
# Deliberately ACTIVITY-based, not process-based. Sleep is blocked while
# torrents are downloading or seeding, not merely because the application is
# open. A machine that never sleeps because a window was left open is a worse
# outcome than the problem being solved.
#
# Check what is holding the machine awake at any time with
# scripts/check-power-inhibitors.sh — qBittorrent appears there by name while a
# transfer is active.
#
# Downloading blocks sleep; seeding deliberately does NOT. The owner's decision,
# 2026-09-06: a download is a task with an end, worth staying awake for. Seeding
# has no end, so honouring it would mean a machine that never suspends again
# once a torrent completes — which is the behaviour roles/power_management
# exists to prevent.
#
# Consequence, stated rather than implied: when the machine suspends, seeding
# stops until it wakes. That is accepted, not overlooked.
#
# Both keys are written explicitly, including the false one. Relying on
# qBittorrent's built-in default would mean the desired state depends on a
# default that could change between versions.
desktop_apps_manage_qbittorrent_suspend: true
desktop_apps_qbittorrent_inhibit_downloading: true
desktop_apps_qbittorrent_inhibit_seeding: false
desktop_apps_qbittorrent_conf: "{{ desktop_apps_home }}/.config/qBittorrent/qBittorrent.conf"

