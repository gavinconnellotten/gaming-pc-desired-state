---
# LibreWolf's repo is not owned by any package — it was added by hand. Without
# this a rebuilt machine has nothing to install the browser from, and the
# default-browser task below would point at a missing desktop file.
- name: Add the LibreWolf repository
  ansible.builtin.copy:
    dest: "{{ desktop_apps_librewolf_repo_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by roles/desktop_apps.
      [librewolf]
      name=LibreWolf Software Repository
      baseurl=https://repo.librewolf.net
      gpgcheck=1
      repo_gpgcheck=1
      gpgkey=https://repo.librewolf.net/pubkey.gpg
      enabled=1
  when: desktop_apps_manage_librewolf_repo | bool

- name: Install desktop applications from dnf
  ansible.builtin.dnf:
    name: "{{ desktop_apps_dnf + (['rclone'] if desktop_apps_install_rclone | bool else []) }}"
    state: present
  when: desktop_apps_dnf | length > 0

# ---------------------------------------------------------------------------
# Flatpaks
#
# Driven with plain commands rather than community.general.flatpak, because
# this repo is ansible-core only — a Galaxy collection would mean another
# install step on a rebuilt machine. Checking before installing is what keeps
# it idempotent; `flatpak install` is not silent about already-installed refs.
#
# become: false throughout. These are USER-scope installs; under sudo they
# would land in root's flatpak installation, which the desktop session never
# shows, and the run would report success.
# ---------------------------------------------------------------------------
- name: Determine the user flatpaks will be installed for
  ansible.builtin.command: id -un
  become: false
  changed_when: false
  check_mode: false
  register: desktop_apps_user
  when: desktop_apps_flatpaks | length > 0

- name: Fail if flatpaks would be installed for root
  ansible.builtin.fail:
    msg: >-
      These are user-scope flatpaks and would be installed into root's flatpak
      installation, where your desktop will never see them. Run the playbook as
      your desktop user with --ask-become-pass rather than under sudo.
  when:
    - desktop_apps_flatpaks | length > 0
    - desktop_apps_user.stdout == 'root'

- name: Check which flatpaks are already installed
  ansible.builtin.command: "flatpak info --user {{ item.id }}"
  become: false
  register: desktop_apps_flatpak_state
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ desktop_apps_flatpaks }}"
  loop_control:
    label: "{{ item.id }}"

- name: Install missing flatpaks
  ansible.builtin.command: >-
    flatpak install --user --noninteractive --assumeyes
    {{ desktop_apps_flatpak_remote }} {{ item.item.id }}
  become: false
  when: item.rc != 0
  loop: "{{ desktop_apps_flatpak_state.results }}"
  loop_control:
    label: "{{ item.item.id }} ({{ item.item.name }})"

- name: Report what is not available on Linux at all
  ansible.builtin.debug:
    msg: >-
      Proton Calendar and Proton Drive have no Linux desktop clients. Calendar
      is built into the Proton Mail app as a tab; Drive is browser-only unless
      you set desktop_apps_install_rclone=true and configure an rclone remote.
      See roles/desktop_apps/README.md.

# ---------------------------------------------------------------------------
# Browser cleanup and default
# ---------------------------------------------------------------------------

# Skipped while desktop_apps_remove is empty, which it is. Brave removal was
# abandoned on 2026-09-12 after failing on every run — see defaults/main.yml
# for why, and why the mechanism is kept rather than deleted.
- name: Remove unwanted browsers
  ansible.builtin.dnf:
    name: "{{ desktop_apps_remove }}"
    state: absent
  when: desktop_apps_remove | length > 0

# Runs after the installs and removals above, deliberately: setting a default
# for a desktop file that isn't there yet silently does nothing.
#
# become: false — this writes ~/.config/mimeapps.list, which is per-user. Under
# sudo it would set root's default browser, which nothing ever consults.
- name: Check whether the default browser is already correct
  ansible.builtin.command: "xdg-settings check default-web-browser {{ desktop_apps_default_browser }}"
  become: false
  register: desktop_apps_browser_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: desktop_apps_default_browser | length > 0

- name: Set the default browser
  ansible.builtin.command: "xdg-settings set default-web-browser {{ desktop_apps_default_browser }}"
  become: false
  when:
    - desktop_apps_default_browser | length > 0
    - desktop_apps_browser_check.stdout | default('') | trim != 'yes'

# Flatpaks open links through the XDG desktop portal, which asks the host for
# the default handler. Nothing had ever set one, so Proton Mail's links went to
# whichever application claimed the scheme first — Brave, as it turned out.
- name: Report the default browser
  ansible.builtin.command: xdg-settings get default-web-browser
  become: false
  register: desktop_apps_browser_now
  changed_when: false
  failed_when: false
  check_mode: false

- name: Show the default browser
  ansible.builtin.debug:
    msg: >-
      Default browser is {{ desktop_apps_browser_now.stdout | default('unknown') | trim }}.
      Flatpaks resolve links through the desktop portal against this, so
      Proton Mail follows it too — restart the flatpak if it was already open.


# ---------------------------------------------------------------------------
# qBittorrent: inhibit sleep during transfers
#
# roles/power_management suspends this machine after an hour idle, and a
# torrent transferring is not idle in any sense worth honouring. qBittorrent
# does this itself via D-Bus — the same inhibition mechanism games use, and the
# one PowerDevil acts on — so this only has to set two settings.
#
# getent, NOT ansible_env.HOME: facts are gathered with the play's become
# already in effect, so that variable is root's. See roles/gaming.
# ---------------------------------------------------------------------------
- name: Determine the desktop user for qBittorrent config
  ansible.builtin.command: id -un
  become: false
  changed_when: false
  check_mode: false
  register: desktop_apps_qb_user
  when: desktop_apps_manage_qbittorrent_suspend | bool

- name: Resolve that user's home directory
  ansible.builtin.command: "getent passwd {{ desktop_apps_qb_user.stdout }}"
  become: false
  changed_when: false
  check_mode: false
  register: desktop_apps_qb_passwd
  when: desktop_apps_manage_qbittorrent_suspend | bool

- name: Set the qBittorrent config path
  ansible.builtin.set_fact:
    desktop_apps_home: "{{ desktop_apps_qb_passwd.stdout.split(':')[5] }}"
  when: desktop_apps_manage_qbittorrent_suspend | bool

- name: Fail if the resolved home is root's
  ansible.builtin.fail:
    msg: >-
      Resolved home is {{ desktop_apps_home }}, which is root's. qBittorrent's
      config belongs to the desktop user. Run the playbook as your desktop user
      with --ask-become-pass, not under sudo.
  when:
    - desktop_apps_manage_qbittorrent_suspend | bool
    - desktop_apps_home == '/root'

# qBittorrent rewrites this file while running and again on exit, so anything
# written underneath it is silently clobbered. Same reasoning as using
# kwriteconfig6 for Plasma rather than copying files: never fight a running
# application for ownership of its own config.
- name: Check whether qBittorrent is running
  ansible.builtin.command: pgrep -x qbittorrent
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
  register: desktop_apps_qb_running
  when: desktop_apps_manage_qbittorrent_suspend | bool

- name: Check whether the qBittorrent config exists yet
  ansible.builtin.stat:
    path: "{{ desktop_apps_qbittorrent_conf }}"
  become: false
  register: desktop_apps_qb_conf
  when: desktop_apps_manage_qbittorrent_suspend | bool

- name: Set qBittorrent to inhibit sleep during transfers
  ansible.builtin.lineinfile:
    path: "{{ desktop_apps_qbittorrent_conf }}"
    regexp: '^General\\{{ item.key }}='
    line: 'General\{{ item.key }}={{ item.value | lower }}'
    insertafter: '^\[Preferences\]'
    state: present
  become: false
  loop:
    - key: PreventFromSuspendWhenDownloading
      value: "{{ desktop_apps_qbittorrent_inhibit_downloading }}"
    - key: PreventFromSuspendWhenSeeding
      value: "{{ desktop_apps_qbittorrent_inhibit_seeding }}"
  loop_control:
    label: "{{ item.key }}"
  register: desktop_apps_qb_written
  when:
    - desktop_apps_manage_qbittorrent_suspend | bool
    - desktop_apps_qb_conf.stat.exists
    - desktop_apps_qb_running.rc != 0

# Report rather than fail. A running qBittorrent is a normal state, not an
# error, and failing the whole play over a preference would be disproportionate.
- name: Report that qBittorrent must be closed to apply this
  ansible.builtin.debug:
    msg: >-
      qBittorrent is running, so its config was NOT modified — it rewrites that
      file on exit and would discard the change. Either close it and re-run, or
      set it yourself in Tools > Options > Behaviour > Power Management:
      "Inhibit system sleep when torrents are downloading" and "...when torrents
      are seeding".
  when:
    - desktop_apps_manage_qbittorrent_suspend | bool
    - desktop_apps_qb_running.rc == 0

- name: Report that qBittorrent has no config yet
  ansible.builtin.debug:
    msg: >-
      {{ desktop_apps_qbittorrent_conf }} does not exist, so there is nothing to
      configure. qBittorrent writes it on first run — start it once, close it,
      then re-run this playbook.
  when:
    - desktop_apps_manage_qbittorrent_suspend | bool
    - not desktop_apps_qb_conf.stat.exists

- name: Note that the sleep inhibition is now set
  ansible.builtin.debug:
    msg: >-
      qBittorrent will now hold a sleep inhibition while torrents are
      downloading or seeding. It is activity-based, not process-based — leaving
      the app open with nothing active still lets the machine suspend. Verify
      with ./scripts/check-power-inhibitors.sh during a transfer.
  when:
    - desktop_apps_manage_qbittorrent_suspend | bool
    - desktop_apps_qb_written.changed | default(false)
