---
- name: Install CIFS client packages
  ansible.builtin.dnf:
    name: "{{ smb_mounts_packages }}"
    state: present

- name: Ensure credentials directory exists
  ansible.builtin.file:
    path: "{{ smb_mounts_credentials_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Passwords are not in this repo by design, so the role can't create these.
# Check first and fail with something actionable, rather than letting mount
# fail later with a bare "permission denied" that looks like a server problem.
- name: Check that credential files exist
  ansible.builtin.stat:
    path: "{{ item.credentials }}"
  register: smb_mounts_cred_stat
  loop: "{{ smb_mounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Fail with instructions if any credential file is missing
  ansible.builtin.fail:
    msg: >-
      Missing SMB credential file(s):
      {{ smb_mounts_cred_stat.results | rejectattr('stat.exists') | map(attribute='item.credentials') | join(', ') }}.
      Create them by running ./scripts/setup-smb-credentials.sh — it prompts
      for the share logins and writes root-owned 0600 files. Nothing will
      mount until they exist.
  when: smb_mounts_cred_stat.results | rejectattr('stat.exists') | list | length > 0

# A credential file others can read is as good as a published password.
- name: Enforce credential file permissions
  ansible.builtin.file:
    path: "{{ item.credentials }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ smb_mounts }}"
  loop_control:
    label: "{{ item.name }}"

# Must exist before the fstab block is validated: findmnt --verify rejects an
# entry whose target directory is missing.
- name: Create mountpoints
  ansible.builtin.file:
    path: "{{ item.mountpoint }}"
    state: directory
    owner: "{{ smb_mounts_uid }}"
    group: "{{ smb_mounts_gid }}"
    mode: "0755"
  loop: "{{ smb_mounts }}"
  loop_control:
    label: "{{ item.mountpoint }}"

# Hand-written CIFS lines left over from an earlier attempt will fight the
# managed block: two fstab entries for one mountpoint produce conflicting
# systemd units, and the losing one tends to be the correct one. Detect rather
# than auto-edit — fstab is boot-critical and this is not a file to rewrite
# unattended.
- name: Find SMB entries in fstab outside the managed block
  ansible.builtin.shell:
    cmd: |
      awk '
        /^# BEGIN ANSIBLE MANAGED: smb_mounts/ { inblock = 1 }
        /^# END ANSIBLE MANAGED: smb_mounts/   { inblock = 0; next }
        !inblock && $0 !~ /^[[:space:]]*#/ && $3 == "cifs" { printf "line %d: %s\n", FNR, $0 }
      ' /etc/fstab
  register: smb_mounts_conflicts
  changed_when: false
  check_mode: false

- name: Fail if unmanaged SMB entries would conflict
  ansible.builtin.fail:
    msg: |-
      /etc/fstab contains CIFS entries this role doesn't manage:

      {{ smb_mounts_conflicts.stdout }}

      Leaving them alongside the managed block gives each mountpoint two
      competing definitions. Comment them out or delete them, then re-run.
      Set smb_mounts_ignore_conflicts=true to proceed anyway (not advised).
  when:
    - smb_mounts_conflicts.stdout | trim | length > 0
    - not smb_mounts_ignore_conflicts | bool

# Reported, not enforced: blockinfile's validate step below checks the whole
# file, so a pre-existing problem elsewhere in fstab would otherwise surface
# as a confusing failure to write our own entries.
- name: Check the health of the existing fstab
  ansible.builtin.command: findmnt --verify --tab-file /etc/fstab
  register: smb_mounts_fstab_health
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn if fstab already has problems
  ansible.builtin.debug:
    msg: >-
      Note: findmnt reports pre-existing issues in /etc/fstab. These are not
      caused by this role, but may block the write below.
      {{ smb_mounts_fstab_health.stdout }}
  when: smb_mounts_fstab_health.rc != 0

# Managed as one delimited block so entries stay together and ordered, and can
# be removed cleanly — rather than accumulating duplicates across runs.
- name: Manage SMB entries in /etc/fstab
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} ANSIBLE MANAGED: smb_mounts"
    block: |
      {% for m in smb_mounts %}
      //{{ m.server }}/{{ m.share }} {{ m.mountpoint }} cifs credentials={{ m.credentials }},uid={{ smb_mounts_uid }},gid={{ smb_mounts_gid }},file_mode={{ smb_mounts_file_mode }},dir_mode={{ smb_mounts_dir_mode }}{% if smb_mounts_version %},vers={{ smb_mounts_version }}{% endif %},{{ smb_mounts_options | join(',') }} 0 0
      {% endfor %}
    backup: true
    validate: "findmnt --verify --tab-file %s"
  notify: Reload systemd for fstab changes
  when: smb_mounts | length > 0

# fstab changes are invisible to systemd until it regenerates its mount and
# automount units, so flush now rather than at the end of the play — the
# verification below depends on it having happened.
- name: Apply fstab changes now
  ansible.builtin.meta: flush_handlers

- name: Start the automount units
  ansible.builtin.systemd_service:
    name: "{{ item.mountpoint | regex_replace('^/', '') | regex_replace('/', '-') }}.automount"
    state: started
    enabled: true
  loop: "{{ smb_mounts }}"
  loop_control:
    label: "{{ item.mountpoint }}"
  failed_when: false

# Touching the mountpoint is what triggers an automount, so this doubles as
# the functional test: if the share lists, the whole chain works.
- name: Verify each share mounts and is readable
  ansible.builtin.command: "ls -A {{ item.mountpoint }}"
  register: smb_mounts_verify
  changed_when: false
  failed_when: false
  loop: "{{ smb_mounts }}"
  loop_control:
    label: "{{ item.mountpoint }}"

- name: Report mount status
  ansible.builtin.debug:
    msg: >-
      {{ item.item.mountpoint }}:
      {% if item.rc != 0 %}FAILED to access — {{ item.stderr | default('unknown error') }}
      {% elif item.stdout | length == 0 %}mounted but EMPTY — check the share
      has content and that the server-side path is right
      {% else %}OK, {{ item.stdout_lines | length }} entries visible
      {% endif %}
  loop: "{{ smb_mounts_verify.results }}"
  loop_control:
    label: "{{ item.item.name }}"
