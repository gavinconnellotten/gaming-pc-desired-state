---
# Host-specific configuration for gaming-pc.
#
# No passwords here. They live in a root-owned 0600 file outside the repo,
# referenced by path. See scripts/setup-smb-credentials.sh.

# Ownership applied to everything inside the CIFS mounts. CIFS carries no Unix
# ownership, so the client decides — these must match the desktop user or the
# shares mount but aren't usable.
smb_mounts_uid: 1000
smb_mounts_gid: 1000

# Pinned rather than negotiated, because 3.0 is the version these mounts were
# actually verified working with on 2026-08-15. The server (Samba 4.24, the
# Home Assistant "SambaNAS2" addon) speaks 3.1.1 too, so this can be set back
# to "" to let the kernel negotiate the highest — but that's an untested
# change, not a free one.
smb_mounts_version: "3.0"

# Both shares live on the same server and use the same login, so they share one
# credential file. Per-share files would also work: the role only cares that
# each entry's `credentials` path exists and is 0600 root:root.
#
# NOTE the `share` values carry a subdirectory ("SSD/MOVIES", not "SSD").
# mount.cifs supports a path below the share root, and these mount the
# subdirectory rather than the whole disk. The share roots are `SSD` and
# `ELEMENTS`; MOVIES and Music are directories within them.
smb_mounts:
  - name: plex-movies
    server: homeassistant.local
    share: SSD/MOVIES
    mountpoint: /mnt/plex-movies
    credentials: /etc/samba/credentials

  - name: plex-music
    server: homeassistant.local
    share: ELEMENTS/Music
    mountpoint: /mnt/plex-music
    credentials: /etc/samba/credentials

  # Written with a literal space. The role escapes it to \040 for fstab —
  # don't pre-escape it here, or it'll be escaped twice.
  - name: plex-tv
    server: homeassistant.local
    share: MEDIA/TV SHOWS
    mountpoint: /mnt/plex-tv
    credentials: /etc/samba/credentials

  # ---------------------------------------------------------------------------
  # The NVIDIA Shield in the lounge, added 2026-09-12. A SECOND server, which
  # is why several things here differ from the three above.
  #
  # Addressed by IP, not hostname. The Shield's SMB advertises itself as
  # "localhost server (Samba, Ubuntu)", so its own name is not to be trusted.
  # The tradeoff is real: a DHCP change breaks this mount, so the Shield wants
  # a static lease on the router.
  #
  # Its own credential file. Same username as the Home Assistant shares, but a
  # different machine and a different password — one shared file would break
  # all four mounts the moment either password changed.
  #
  # NOTE: /etc/samba/credentials-shield sits ALONGSIDE the file
  # /etc/samba/credentials rather than inside it. setup-smb-credentials.sh
  # defaults to treating that path as a directory, which cannot work on this
  # machine because it is already a file. The script catches it and asks for
  # another path; see the CHANGELOG.
  #
  # This is an Android TV box: it reboots for updates and gets switched off
  # casually, far less predictably than the Home Assistant machine. The
  # x-systemd.automount options the role applies are what make that safe — an
  # absent server gives an empty mountpoint rather than a hung boot. Do not put
  # anything this desktop depends on behind it.
  - name: shield-downloads
    server: 192.168.68.102
    share: internal/Download
    mountpoint: /mnt/shield-downloads
    credentials: /etc/samba/credentials-shield
