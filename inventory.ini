[local]
gaming-pc ansible_connection=local ansible_host=localhost

[local:vars]
# Pinned rather than left to Ansible's auto-discovery, which warns that a
# later-installed Python could be discovered instead. /usr/bin/python3 is a
# symlink owned by the `python3` RPM and tracks the system Python across
# Fedora releases — unlike /usr/bin/python3.14, which would break on the next
# major upgrade. For a repo whose job is to survive a rebuild, "whichever
# Python happened to be found" is the wrong answer even when it's the right
# interpreter.
ansible_python_interpreter=/usr/bin/python3
